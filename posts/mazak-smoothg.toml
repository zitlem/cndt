# Mazak machining centres on Mazatrol SmoothG and similar controls, in
# EIA/ISO (G-code) mode. Mazatrol conversational programs are not produced.
#
# UNVERIFIED: this post has not been run on a real controller. Do not set
# `verified = true` until its output has cut a test part on the named
# controller, and record that run as docs/safety.md describes.
#
# Written from the general Fanuc-style dialect that Mazak's EIA/ISO mode
# reads and Mazak's public G-code list (G84.2 synchronous tapping); not
# derived from any vendor post. The way to the tool change position (G53 Z0,
# then G30 for Z, Y and X) follows the owner's MACH1 generators for their
# Mazak horizontals (github.com/zitlem/MACH1, GPL-3.0). Note that M29 is a
# robot request on a Mazak, not rigid tapping: never run Fanuc-post output
# here. Before the first run, check the tool-change sequence, the
# synchronous tapping format, the B index and the program end on the
# machine. On a horizontal machine Z is the spindle axis, so "up" is away
# from the pallet.
#
# The work offset is G54 to G59, which on SmoothG are the same offsets as
# the Mazatrol WPC table.

[post]
id = "mazak-smoothg"
name = "Mazak SmoothG (EIA/ISO)"
version = "0.1.0"
verified = false

[format]
decimals = 3
feed_decimals = 1
trim_zeros = true
# As on Fanuc, a coordinate without a point may be read in thousandths.
keep_decimal_point = true
line_numbers = { start = 10, step = 10 }
comment = { open = "(", close = ")", uppercase = true }
percent_wrapped = true
program_number_digits = 4

[program]
first_line = "O{program_number} ({program_name})"
start = [
    "{header}",
    # As in the owner's MACH1 programs, metric.
    "G21 G17 G40 G49 G80 G90 G94",
    "{work_offset}",
]
end = [
    "M9",
    "M5",
    # Spindle back from the work, then to the tool change position.
    "G53 Z0.",
    "G91 G30 Z0.",
    "G30 Y0.",
    "G30 X0.",
    "G90",
    "M30",
]

[codes]
rapid = "G0"
linear = "G1"
arc_cw = "G2"
arc_ccw = "G3"
spindle_cw = "M3 S{rpm}"
spindle_ccw = "M4 S{rpm}"
spindle_off = "M5"
coolant_flood = "M8"
coolant_mist = "M7"
coolant_off = "M9"
stop = "M0"
optional_stop = "M1"
# Without a decimal point, P is in milliseconds.
dwell = "G4 P{milliseconds}"
tool_change = [
    "M5",
    # Spindle back from the work, then to the tool change position.
    "G53 Z0.",
    "G91 G30 Z0.",
    "G30 Y0.",
    "G30 X0.",
    "G90",
    "T{tool} M6",
]
# Applied with the first Z move after every tool change, and after going home.
tool_length_compensation = "G43 H{tool}"
# The tool change position: clear of the part before the table turns or the
# operator turns the part.
home = [
    "G53 Z0.",
    "G91 G30 Z0.",
    "G30 Y0.",
    "G30 X0.",
    "G90",
]
# The B table to a face. Check on the machine whether it clamps on its own
# or needs a clamp code.
index = "G0 {axis}{angle}"

[cycles]
retract = "G98"
drill = "G81 X{x} Y{y} Z{z} R{r} F{feed}"
peck = "G83 X{x} Y{y} Z{z} R{r} Q{peck} F{feed}"
# Synchronous (rigid) tapping. With G94, F is the spindle speed times the
# pitch, in mm/min.
tap = "G84.2 X{x} Y{y} Z{z} R{r} F{feed}"
ream = "G85 X{x} Y{y} Z{z} R{r} F{feed}"
repeat = "X{x} Y{y}"
cancel = "G80"
