[package]
name = "cndt-desktop"
description = "The CNDT desktop app: a Tauri shell around the CNDT API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cndt-desktop"
path = "src/main.rs"

[dependencies]
cndt-api.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[lints]
workspace = true
