[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.99"

# Internal crates are declared here once and used as `cndt-geom.workspace = true`.
# The layer check in xtask reads these names; see docs/architecture.md.
[workspace.dependencies]
cndt-api = { path = "crates/api" }
cndt-cam-core = { path = "crates/cam-core" }
cndt-engine = { path = "crates/engine" }
cndt-format = { path = "crates/format" }
cndt-geom = { path = "crates/geom" }
cndt-kernel = { path = "crates/kernel" }
cndt-model = { path = "crates/model" }
cndt-occt-sys = { path = "crates/occt-sys" }
cndt-post = { path = "crates/post" }
cndt-process-mill = { path = "crates/process-mill" }
cndt-sim = { path = "crates/sim" }
cndt-sketch = { path = "crates/sketch" }

# External crates. Each must be AGPL-3.0 compatible; `cargo xtask licenses`
# checks every crate in the dependency tree.
serde = { version = "1", features = ["derive"] }
# Exact float parsing: a saved project must reopen bit for bit (rule 9).
serde_json = { version = "1", features = ["float_roundtrip"] }
# Post-processor definitions are TOML files a shop can read and edit.
toml = "1"
# Project files are ZIP containers. Only deflate support is built in.
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Core crates must not panic on bad input (architecture rule 14).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Geometry compares with tolerances, never exact float equality (rule 10).
float_cmp = "deny"
# HashMap, HashSet and wall-clock time are blocked in clippy.toml (rule 11).
disallowed_types = "deny"
disallowed_methods = "deny"

# Stock simulation sweeps millions of cells; optimise it even in debug builds
# so the tests that simulate whole setups stay quick. Floating-point results
# do not depend on the optimisation level.
[profile.dev.package.cndt-sim]
opt-level = 3
