[package]
name = "cndt-occt-sys"
description = "Layer 0: the C ABI bridge to OpenCascade. Only cndt-kernel may use it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
links = "TKernel"

[build-dependencies]
cc = "1"

# The only crate allowed `unsafe`. It cannot inherit the workspace lints,
# which forbid it, so the rest of the set is repeated here.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
