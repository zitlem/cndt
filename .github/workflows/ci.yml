name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Login shell, so the conda environment below is active in every step.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # OpenCascade 7.9.3 on every system (decision 0008).
      - name: Install OpenCascade (Homebrew)
        if: runner.os == 'macOS'
        run: brew install opencascade

      - name: Install OpenCascade (conda-forge)
        if: runner.os != 'macOS'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: occt
          create-args: occt=7.9.3
          init-shell: bash
          cache-environment: true

      - name: Point the build at OpenCascade
        if: runner.os != 'macOS'
        run: echo "OCCT_DIR=$(cygpath -w "$CONDA_PREFIX" 2>/dev/null || echo "$CONDA_PREFIX")" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Format, lints, tests, layers, headers
        run: cargo xtask ci
